server.port=8080
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.locations=classpath:db/mysql
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
server.error.include-message=always
hrms.jwt.secret=${JWT_SECRET:}
hrms.jwt.minutes=${JWT_MINUTES:60}
hrms.auth.production=false
hrms.auth.origins=${APP_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
hrms.auth.cookie-secure=false
hrms.webmail.enabled=true
# Mailpit/localhost transport is test-only. Production delivery uses MailerSend.
hrms.local-mail.enabled=false
hrms.mail.domain=${HRMS_MAIL_DOMAIN:xpertsedgetech.com}
hrms.admin.email=${ADMIN_EMAIL:admin@xpertsedgetech.com}
hrms.admin.password=${ADMIN_PASSWORD:Admin@123}
hrms.admin.name=${ADMIN_NAME:Admin}
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.mvc.log-request-details=false
logging.file.name=${LOG_DIR:logs}/xpertsedge-hrms.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.level=%5p [requestId=%X{requestId:-startup}]
